name: Fix time-series operatorname

on:
  push:
    branches:
      - add-time-series-formula-tables

permissions:
  contents: write

jobs:
  fix-operatorname:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-time-series-formula-tables

      - name: Replace unsupported operatorname commands
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('notes/time_series').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(r'\\operatorname\{([^{}]+)\}', r'\\mathrm{\1}', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for path in changed:
              print(path)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet -- notes/time_series; then
            echo "No operatorname commands found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/time_series
          git commit -m "Use GitHub-safe math operators in time-series notes"
          git push origin HEAD:add-time-series-formula-tables
